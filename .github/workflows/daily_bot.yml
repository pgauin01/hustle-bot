name: Daily HustleBot

on:
  schedule:
    # --- PRODUCTION SCHEDULE (Every 96 minutes) ---
    - cron: "0 0,8,16 * * *"
    - cron: "36 1,9,17 * * *"
    - cron: "12 3,11,19 * * *"
    - cron: "48 4,12,20 * * *"
    - cron: "24 6,14,22 * * *"

    # (Test mode has been deleted)

  workflow_dispatch: # Keeps your manual "Run Now" button active

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Bot
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_JSON }}
        run: python automate.py --once
